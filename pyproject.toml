[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wnd-check"
version = "0.3.0"
description = "A typed SDK for what-needs-doing-style health checks (IHealthCheck / HealthIndicator-inspired)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "greenlight" }]
keywords = ["health-check", "healthcheck", "monitoring", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Zero runtime dependencies — stdlib only, so it installs trivially in any CI runner.
dependencies = []

[project.urls]
Homepage = "https://github.com/greenlight908/wnd-check"
Issues = "https://github.com/greenlight908/wnd-check/issues"

# The pre-commit hook's entry point (see .pre-commit-hooks.yaml). Installing the package
# puts `wnd-sdk-gate` on PATH; pre-commit builds an isolated env that does exactly that.
[project.scripts]
wnd-sdk-gate = "wnd_check.gate:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wnd_check"]

[tool.ruff]
# Line length is not enforced (see the estate ruff baseline).
line-length = 320

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "RUF", "PERF101", "PERF401"]
ignore = [
    "E501",   # line length — not enforced
    "S101",   # assert — legitimate in tests and invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
